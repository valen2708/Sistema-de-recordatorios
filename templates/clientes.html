{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">Clientes</h4>
    <a href="/clientes/nuevo" class="btn btn-success"><i class="bi bi-plus-circle me-1"></i>Nuevo cliente</a>
</div>

<div class="card">
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th>Nombre</th>
                    <th>Teléfono</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                {% for c in clientes %}
                <tr>
                    <td><strong>{{ c.nombre }}</strong></td>
                    <td>{{ c.telefono }}</td>
                    <td class="text-end">
                        <a href="/ventas/nueva?cliente_id={{ c.id }}&nombre={{ c.nombre }}" class="btn btn-sm btn-outline-success me-1">
                            <i class="bi bi-cart-plus me-1"></i>Nueva venta
                        </a>
                        <form method="POST" action="/clientes/{{ c.id }}/eliminar" class="d-inline" onsubmit="return confirm('¿Eliminar a {{ c.nombre }}? También se eliminarán sus ventas.')">
                            <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
                {% if not clientes %}
                <tr><td colspan="3" class="text-center text-muted py-4">No hay clientes cargados aún.</td></tr>
                {% endif %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
