<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pistas de Blue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:       #0f1117;
            --surface:  #1a1d27;
            --surface2: #22263a;
            --border:   #2e3248;
            --accent:   #6ee7b7;
            --accent2:  #34d399;
            --fg:       #e2e8f0;
            --muted:    #6b7280;
            --danger:   #f87171;
            --warning:  #fbbf24;
            --sidebar-w: 220px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--fg);
            margin: 0;
            min-height: 100vh;
        }

        /* ── Sidebar ── */
        #sidebar {
            position: fixed;
            top: 0; left: 0;
            width: var(--sidebar-w);
            height: 100vh;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 100;
            transition: transform .25s ease;
        }

        .sidebar-brand {
            padding: 24px 20px 16px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-brand .brand-icon {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, var(--accent), #10b981);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            color: #0f1117;
            margin-bottom: 10px;
        }
        .sidebar-brand h6 {
            font-weight: 700;
            color: var(--fg);
            margin: 0;
            font-size: 14px;
            line-height: 1.3;
        }
        .sidebar-brand small {
            color: var(--muted);
            font-size: 11px;
        }

        .sidebar-nav {
            flex: 1;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .sidebar-nav .nav-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 10px 8px 4px;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 8px;
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: background .15s, color .15s;
        }
        .sidebar-nav a i { font-size: 16px; }
        .sidebar-nav a:hover { background: var(--surface2); color: var(--fg); }
        .sidebar-nav a.active { background: rgba(110,231,183,.12); color: var(--accent); }
        .sidebar-nav a.active i { color: var(--accent); }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--border);
        }
        .sidebar-footer a {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 12px; border-radius: 8px;
            color: var(--muted); text-decoration: none;
            font-size: 14px; font-weight: 500;
            transition: background .15s, color .15s;
        }
        .sidebar-footer a:hover { background: rgba(248,113,113,.1); color: var(--danger); }

        /* ── Main content ── */
        #main {
            margin-left: var(--sidebar-w);
            min-height: 100vh;
            padding: 32px 36px;
        }

        /* ── Cards ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: none;
        }

        /* ── Tables ── */
        .table { color: var(--fg); }
        .table thead th {
            background: var(--surface2);
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .05em;
            border-bottom: 1px solid var(--border);
        }
        .table tbody tr { border-bottom: 1px solid var(--border); }
        .table tbody tr:last-child { border-bottom: none; }
        .table-hover tbody tr:hover { background: var(--surface2); }
        .table-secondary { background: rgba(255,255,255,.04) !important; }

        /* ── Inputs ── */
        .form-control, .form-select {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--fg);
            border-radius: 8px;
        }
        .form-control:focus, .form-select:focus {
            background: var(--surface2);
            border-color: var(--accent);
            color: var(--fg);
            box-shadow: 0 0 0 3px rgba(110,231,183,.15);
        }
        .form-control::placeholder { color: var(--muted); }

        /* ── Buttons ── */
        .btn-success {
            background: var(--accent2);
            border-color: var(--accent2);
            color: #0f1117;
            font-weight: 600;
        }
        .btn-success:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #0f1117;
        }
        .btn-outline-secondary {
            border-color: var(--border);
            color: var(--muted);
        }
        .btn-outline-secondary:hover {
            background: var(--surface2);
            color: var(--fg);
            border-color: var(--border);
        }
        .btn-outline-danger { border-color: #4b2d2d; color: var(--danger); }
        .btn-outline-danger:hover { background: rgba(248,113,113,.1); color: var(--danger); }
        .btn-primary {
            background: #4f6ef7;
            border-color: #4f6ef7;
            font-weight: 600;
        }

        /* ── Badges ── */
        .badge.bg-danger  { background: rgba(248,113,113,.2)  !important; color: var(--danger)  !important; border: 1px solid rgba(248,113,113,.3); }
        .badge.bg-warning { background: rgba(251,191,36,.15)  !important; color: var(--warning) !important; border: 1px solid rgba(251,191,36,.25); }
        .badge.bg-success { background: rgba(52,211,153,.15)  !important; color: var(--accent2) !important; border: 1px solid rgba(52,211,153,.25); }
        .badge.bg-secondary { background: var(--surface2) !important; color: var(--muted) !important; border: 1px solid var(--border); }

        /* ── Alerts ── */
        .alert-success { background: rgba(52,211,153,.1); border-color: rgba(52,211,153,.25); color: var(--accent); }
        .alert-danger  { background: rgba(248,113,113,.1); border-color: rgba(248,113,113,.25); color: var(--danger); }
        .alert-warning { background: rgba(251,191,36,.1);  border-color: rgba(251,191,36,.25);  color: var(--warning); }

        /* ── Modals ── */
        .modal-content { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
        .modal-header { border-bottom: 1px solid var(--border); }
        .modal-footer { border-top: 1px solid var(--border); }
        .btn-close { filter: invert(1) opacity(.5); }

        /* ── Mobile hamburger ── */
        #toggle-sidebar {
            display: none;
            position: fixed;
            top: 14px; left: 14px;
            z-index: 200;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--fg);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 18px;
            cursor: pointer;
        }
        #overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,.5);
            z-index: 99;
        }

        @media (max-width: 768px) {
            #toggle-sidebar { display: block; }
            #sidebar { transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
            #overlay.open { display: block; }
            #main { margin-left: 0; padding: 60px 16px 32px; }
        }
    </style>
</head>
<body>

<button id="toggle-sidebar"><i class="bi bi-list"></i></button>
<div id="overlay"></div>

<aside id="sidebar">
    <div class="sidebar-brand">
        <div class="brand-icon">🐾</div>
        <h6>Pistas de Blue</h6>
        <small>Sistema de recordatorios</small>
    </div>
    <nav class="sidebar-nav">
        <span class="nav-label">Menú</span>
        <a href="/" {% if request.path == '/' %}class="active"{% endif %}>
            <i class="bi bi-grid-1x2"></i> Dashboard
        </a>
        <a href="/clientes" {% if '/clientes' in request.path %}class="active"{% endif %}>
            <i class="bi bi-people"></i> Clientes
        </a>
        <a href="/ventas" {% if request.path.startswith('/ventas') %}class="active"{% endif %}>
            <i class="bi bi-cart3"></i> Ventas
        </a>
        <a href="/recordatorios" {% if '/recordatorios' in request.path %}class="active"{% endif %}>
            <i class="bi bi-whatsapp"></i> Recordatorios
        </a>
        <span class="nav-label">Sistema</span>
        <a href="/configuracion" {% if '/configuracion' in request.path %}class="active"{% endif %}>
            <i class="bi bi-sliders"></i> Configuración
        </a>
    </nav>
    <div class="sidebar-footer">
        <a href="/logout"><i class="bi bi-box-arrow-left"></i> Salir</a>
    </div>
</aside>

<main id="main">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show mb-4" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const toggle  = document.getElementById('toggle-sidebar');
    toggle.addEventListener('click', () => {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('open');
    });
    overlay.addEventListener('click', () => {
        sidebar.classList.remove('open');
        overlay.classList.remove('open');
    });
</script>
</body>
</html>
