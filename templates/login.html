<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop - Ingresar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.1); border-radius: 16px; width: 100%; max-width: 360px; }
        .logo { color: #2c7a4b; font-size: 2rem; }
    </style>
</head>
<body>
<div class="card p-4">
    <div class="text-center mb-4">
        <div class="logo">🐾</div>
        <h5 class="fw-bold mt-2">PetShop Recordatorios</h5>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" class="form-control form-control-lg" autofocus required>
        </div>
        <button type="submit" class="btn btn-success w-100 btn-lg">Ingresar</button>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
