{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0"><i class="bi bi-person-gear me-2"></i>Editar Cliente</h4>
    <a href="/clientes" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Volver</a>
</div>

<div class="card p-4" style="max-width: 500px;">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label fw-semibold">Nombre</label>
            <input type="text" name="nombre" class="form-control" value="{{ cliente.nombre }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Teléfono</label>
            <input type="text" name="telefono" class="form-control" value="{{ cliente.telefono }}" required>
            <div class="form-text">Formato: código de país + número sin espacios ni +</div>
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold">Dirección <span style="color:var(--muted);font-weight:400;">(opcional)</span></label>
            <input type="text" name="direccion" class="form-control" value="{{ cliente.direccion or '' }}" placeholder="Ej: Av. Colón 1234">
        </div>
        <button type="submit" class="btn btn-success w-100"><i class="bi bi-check-circle me-1"></i>Guardar cambios</button>
    </form>
</div>
{% endblock %}
