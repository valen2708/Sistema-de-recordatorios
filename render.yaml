services:
  - type: web
    name: petshop-recordatorios
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -c gunicorn_config.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: petshop-recordatorios-db
          property: connectionString
      - key: GREENAPI_INSTANCE
        sync: false
      - key: GREENAPI_TOKEN
        sync: false
      - key: SCHEDULER_SECRET
        generateValue: true

  - type: cron
    name: petshop-recordatorios-scheduler
    runtime: python
    schedule: "0 12 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "from database import init_db; init_db(); from scheduler import revisar_vencimientos; revisar_vencimientos()"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: petshop-recordatorios-db
          property: connectionString
      - key: GREENAPI_INSTANCE
        value: "710722763445"
      - key: GREENAPI_TOKEN
        value: "3656535a6e504409b2304207feb8a015cbdd13f9ad8b4a21a0"

databases:
  - name: petshop-recordatorios-db
    plan: free
